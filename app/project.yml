# XcodeGen spec. scripts/build.sh generates AdsPulse.xcodeproj from this (the .xcodeproj is not committed).
name: AdsPulse
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc by default; scripts/build.sh switches to Automatic when TEAM_ID is set.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AdsPulse:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.adspulse
        PRODUCT_NAME: Ads Pulse
        CODE_SIGN_ENTITLEMENTS: App/AdsPulse.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ads Pulse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ads Pulse
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: AdsPulseWidget
        embed: true
  AdsPulseWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.adspulse.widget
        PRODUCT_NAME: AdsPulseWidget
        CODE_SIGN_ENTITLEMENTS: Widget/AdsPulseWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Ads Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
